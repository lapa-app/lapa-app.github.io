<style>
  :root { --primary: #914c01; --deep: #5c3000; --page: #fff8f5; --cream: #fdfaf5; --ink: #3a2a1e; --quiet: #7a5e48; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 40px 16px 32px; text-align: center; }
  .icon { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 6px 18px rgba(92,48,0,.25); }
  h1 { font-size: 26px; line-height: 1.2; margin: 20px 0 8px; color: var(--deep); }
  p { margin: 0 0 6px; color: var(--quiet); }
  .play { display: block; margin: 28px auto 10px; padding: 18px 20px; max-width: 360px;
          background: var(--primary); color: #fff; text-decoration: none; border-radius: 14px;
          font-size: 20px; font-weight: 600; }
  .play:active { background: var(--deep); }
  .small { font-size: 14px; }
  .feature { width: 100%; border-radius: 12px; margin-top: 28px; }
  footer { margin-top: 28px; font-size: 13px; color: var(--quiet); }
  footer a { color: var(--quiet); }
</style>
